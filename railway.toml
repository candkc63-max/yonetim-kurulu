[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**/*.js", "**/*.ts", "**/*.tsx", "package.json", "package-lock.json", "railway.toml", "Dockerfile", ".env.local"]

[deploy]
startCommand = "bash -lc 'set -a; [ -f .env.local ] && source .env.local; set +a; npm run start'"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# 12:00,14:00,16:00,18:00,20:00 Europe/Istanbul (UTC+3) -> 09:00,11:00,13:00,15:00,17:00 UTC
cronSchedule = "0 9,11,13,15,17 * * 1-5"
